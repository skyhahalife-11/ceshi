name: build-suture

# 六种目标组合各自在对应系统的机器上构建。
# PyInstaller 不支持跨系统交叉编译，所以必须是六条并行的构建，不能在一台机器上出全部产物。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: windows-arm64
            runner: windows-11-arm
          - target: macos-universal      # universal2：一个文件同时覆盖 Intel 和 Apple Silicon
            runner: macos-latest
          - target: macos-x64            # 兜底：万一 universal2 的依赖凑不齐，仍单独出 Intel 版
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-22.04         # 固定在较老的发行版上构建，产物才能在更新的系统上跑
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 跑一遍验收测试
        run: python -m unittest discover -s tests -t .

      - name: 构建
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install pywebview || echo "pywebview unavailable on this target"
          if [[ "${{ matrix.target }}" == "macos-x64" ]]; then export SUTURE_TARGET_ARCH=x86_64; fi
          if [[ "${{ matrix.target }}" == "macos-universal" ]]; then export SUTURE_TARGET_ARCH=universal2; fi
          python -m PyInstaller --clean --noconfirm build/suture.spec

      # 签名是必须的，不是可选项：
      # macOS 不签名 + 不公证，Gatekeeper 会直接拦截，非技术用户根本打不开；
      # Windows 不签名会弹 SmartScreen 警告，对一个要读 Key 的工具很难建立信任。
      # 证书就绪后在这里补上 codesign/notarytool 与 signtool 两步。

      - name: 整理成带平台标识的最终产物名
        shell: bash
        run: |
          cd dist
          case "${{ matrix.target }}" in
            windows-*)
              mv suture.exe "suture-${{ matrix.target }}.exe"
              ;;
            macos-*)
              # BUNDLE() 产出的是 Suture.app 目录，压缩成 zip 才能当一个文件分发；
              # EXE() 那份裸的 Unix 可执行文件只是构建 .app 用的中间产物，不对外发。
              ditto -c -k --sequesterRsrc --keepParent Suture.app "suture-${{ matrix.target }}.zip"
              rm -rf Suture.app suture
              ;;
            linux-*)
              mv suture "suture-${{ matrix.target }}"
              ;;
          esac
          ls -la

      - name: 计算校验值
        shell: bash
        run: |
          cd dist
          if command -v shasum >/dev/null; then shasum -a 256 suture-* > SHA256SUMS.txt;
          else sha256sum suture-* > SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: suture-${{ matrix.target }}
          path: |
            dist/suture-*
            dist/SHA256SUMS.txt

  # 只有推 v* 的 tag 才会跑：之前六个 job 各自把产物传去 artifact 就算完了，
  # artifact 需要登录 GitHub 才能下载、有保留期，tag 推送之后实际上什么都没
  # 发布出去。这一步把六份产物收集起来，合并成一份 Release，才是真的能给
  # 用户一个下载链接的形态。
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: suture-*
          path: artifacts

      - name: 合并六份校验值，把产物摊平成一个目录
        shell: bash
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            find "$d" -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec cp {} release/ \;
          done
          cat artifacts/*/SHA256SUMS.txt > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
